<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="以週為單位規劃點眼藥水，並記錄每天是否點完。">
<meta name="theme-color" content="#C8475F">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="眼藥水">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preload" href="wenkai.woff2" as="font" type="font/woff2" crossorigin>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>眼藥水規劃器</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"WenKai";src:url("wenkai.woff2") format("woff2");font-weight:400 700;font-display:swap}
/* Layout: single centered column like a pharmacy dosing card — today's doses split OS/OD, a fixed dock with the 規劃 button; plan screen is a week ledger of seven day rows. */
/* 蜜桃便條: peach paper, white rounded cards, WenKai headings. Light-only by design. */
:root{
  --bg:#FBF3E6; --surface:#FFFCF6; --sunk:#F4E7D4; --ink:#3D2B1F; --muted:#86695A; --line:#EAD8C1; --card-line:#EAD8C1;
  --accent:#B8621A; --accent-soft:#FBE5CB; --on-accent:#FFFFFF;
  --eyeL:#2D6B8A; --eyeL-soft:#DCEDF3; --eyeR:#AD4458; --eyeR-soft:#F8DFE3;
  --done:#4A8638; --done-soft:#E3F0D6; --warn:#B4442A; --warn-soft:#F8DDD2;
  --scrim:rgba(61,43,31,.42);
  --shadow:0 2px 0 #EAD8C1; --r:18px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans CJK TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --num:-apple-system,BlinkMacSystemFont,"Roboto","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
:root{
  --bg:#FFF0EA; --surface:#FFFFFF; --sunk:#FCE3DB; --ink:#4A2C33; --muted:#8C666E; --line:#F2D2CA; --card-line:transparent;
  --accent:#C8475F; --accent-soft:#FCDCE2; --on-accent:#FFFFFF;
  --eyeL:#4A63BE; --eyeL-soft:#E3E8FA; --eyeR:#8752B5; --eyeR-soft:#EEE2F8;
  --done:#2F8F5E; --done-soft:#DBF2E5; --warn:#BF4A2E; --warn-soft:#FBE0D7;
  --scrim:rgba(74,44,51,.42);
  --shadow:0 4px 16px rgba(200,71,95,.12); --r:24px;
  --display:"WenKai",-apple-system,"PingFang TC","Noto Sans CJK TC",sans-serif;
}
.today-h,.eye-h b,.wk-label,.card-h h2,.empty-day h2,.sheet h2,.btn-plan,.brand,.bar-row h1{font-family:var(--display)}
.dose,.card,.empty-day{border-radius:var(--r)!important;box-shadow:var(--shadow);border-color:var(--card-line)!important}
.btn-plan,.add,.dose-state{border-radius:calc(var(--r) - 4px)!important}
:root .L .dose,:root .R .dose{border-top-width:0;border-left:6px solid}
:root .L .dose{border-left-color:var(--eyeL)!important}
:root .R .dose{border-left-color:var(--eyeR)!important}

*{box-sizing:border-box}
html,body{background:var(--bg)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Today ---------- */
#home{padding-block:20px 120px}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:.12em;color:var(--accent)}
.brand svg{width:16px;height:16px}
.today-h{margin:8px 0 2px;font-size:30px;font-weight:700;line-height:1.2;text-wrap:balance}
.today-h .wd{font-size:22px;font-weight:500;color:var(--muted);margin-left:6px}
.today-sub{color:var(--muted);font-size:17px}
.progress{margin-top:14px;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);border-radius:99px;transition:width .3s}
.progress .num{font-size:18px;font-weight:600;white-space:nowrap}

.eyes{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.eye-col{min-width:0;display:flex;flex-direction:column;gap:10px}
.eye-h{display:flex;align-items:baseline;gap:8px;padding:0 2px}
.eye-h b{font-size:24px}
.eye-code{font-family:var(--num);font-weight:600;font-size:15px;letter-spacing:.08em;padding:1px 7px;border-radius:6px}
.L .eye-code{color:var(--eyeL);background:var(--eyeL-soft)}
.R .eye-code{color:var(--eyeR);background:var(--eyeR-soft)}
.eye-h .cnt{margin-left:auto;color:var(--muted);font-size:15px}
.eye-empty{border:1.5px dashed var(--line);border-radius:14px;padding:18px 12px;color:var(--muted);font-size:17px;text-align:center}

.dose{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.L .dose{border-top:3px solid var(--eyeL)}
.R .dose{border-top:3px solid var(--eyeR)}
.dose:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.dose-name{display:flex;gap:8px;align-items:flex-start;font-weight:700;font-size:20px;line-height:1.35;overflow-wrap:anywhere}
.dose-row{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.drops{font-size:18px;color:var(--muted)}
.drops b{font-family:var(--num);font-size:35px;line-height:1;color:var(--ink);margin-right:2px}
.dose-time{font-size:18px;color:var(--muted)}
.dose-state{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:8px;font-size:17px;font-weight:500;background:var(--sunk);color:var(--muted)}
.dose-state .ring{width:18px;height:18px;border-radius:50%;border:2px solid currentColor}
.dose[aria-pressed="true"]{background:var(--done-soft);border-color:transparent}
.dose[aria-pressed="true"] .dose-state{background:var(--done);color:var(--surface)}
.dose[aria-pressed="true"] .dose-name,.dose[aria-pressed="true"] .drops b{opacity:.75}

.cap{flex:none;width:14px;height:18px;margin-top:3px;border-radius:4px 4px 3px 3px;background:var(--cap);box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 0 0 1px var(--line)}

.empty-day{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 20px;text-align:center}
.empty-day h2{margin:0 0 6px;font-size:24px}
.empty-day p{margin:0;color:var(--muted)}
.note{margin:22px 2px 0;font-size:15px;color:var(--muted)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.dock .wrap{display:flex}
.btn-plan{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:16px;padding:16px;background:var(--accent);color:var(--on-accent);font-size:22px;font-weight:700;letter-spacing:.2em}
.btn-plan svg{width:22px;height:22px}

/* ---------- Banner / toast ---------- */
.banner{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:17px}
.banner span{flex:1 1 200px}
.banner button{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:17px;max-width:calc(100% - 32px)}

/* ---------- Plan ---------- */
#plan{padding-bottom:40px}
.plan-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px 12px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-row h1{margin:0;font-size:21px;flex:1;text-align:center}
.link-btn{border:0;background:none;color:var(--accent);font-weight:700;padding:8px 4px;min-width:64px;text-align:left}
.link-btn.r{text-align:right}
.weeknav{margin-top:8px;display:flex;align-items:center;gap:8px}
.wk-arrow{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.wk-arrow svg{width:20px;height:20px}
.wk{flex:1;text-align:center}
.wk-label{font-size:26px;font-weight:700}
.wk-tag{font-size:14px;color:var(--muted)}
.week-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:17px;font-weight:500}
.chip-btn.danger{color:var(--warn)}

.days{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px}
.day.is-today{border:2px solid var(--accent)}
.day.is-past{background:color-mix(in srgb,var(--surface) 70%,var(--bg))}
.day-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.d-date{font-family:var(--num);font-size:24px;font-weight:600}
.d-wd{color:var(--muted);font-size:18px}
.d-today{font-size:14px;font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:6px;padding:1px 7px}
.badge{font-size:14px;font-weight:700;border-radius:6px;padding:2px 8px}
.badge.ok{color:var(--done);background:var(--done-soft)}
.badge.miss{color:var(--warn);background:var(--warn-soft)}
.badge.part{color:var(--muted);background:var(--sunk)}
.day-h .spacer{flex:1}
.mini{border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:6px 2px}
.entries{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.entry{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:44px auto minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:10px 4px;border-top:1px solid var(--line)}
.entry:focus-visible{outline:3px solid var(--accent);outline-offset:-2px;border-radius:8px}
.entry .t{color:var(--muted);font-size:18px;font-weight:500}
.entry .n{font-weight:500;overflow-wrap:anywhere}
.entry .dr{font-family:var(--num);font-weight:600;white-space:nowrap}
.entry .cap{margin-top:0}
.eye-chip{font-size:15px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.eye-chip.L{color:var(--eyeL);background:var(--eyeL-soft)}
.eye-chip.R{color:var(--eyeR);background:var(--eyeR-soft)}
.eye-chip.B{color:var(--accent);background:var(--accent-soft)}
.entry .tick{width:16px;height:16px;color:var(--done)}
.add{margin-top:6px;width:100%;border:1.5px dashed var(--line);background:none;border-radius:10px;padding:9px;color:var(--accent);font-weight:700;font-size:18px}
.plan-foot{margin-top:24px;display:flex;justify-content:center;flex-wrap:wrap;gap:10px}

.card{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.card-h{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.card-h h2{margin:0;font-size:21px}
.card-h .wk-range{font-size:28px;font-weight:600}
.card-h+.entries{margin-top:10px}
.card-h span{color:var(--muted);font-size:15px}
.card-empty{margin:12px 0 10px}
.slot-h{margin-top:14px;font-size:15px;font-weight:700;color:var(--accent);letter-spacing:.12em}
.slot-h+.entries{margin-top:2px}
.card .add{margin-top:12px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.cell{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0;border-radius:10px;background:var(--sunk);color:var(--muted);font-size:14px;min-width:0}
.cell b{font-size:14px;letter-spacing:-.02em;color:var(--ink);font-weight:600}
.cell .st{font-weight:700;font-size:14px;white-space:nowrap}
.cell.ok{background:var(--done-soft);color:var(--done)}
.cell.miss{background:var(--warn-soft);color:var(--warn)}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.week-actions:empty{display:none}
/* ---------- Install ---------- */
.install{margin-top:16px;display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 10px 12px 14px}
.install-ico{flex:none;width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.install-ico svg{width:26px;height:26px}
.install .txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.install .txt b{font-size:18px}
.install .txt span{font-size:15px;color:var(--muted)}
.install .go{flex:none;border:0;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:10px 14px;font-weight:700;font-size:17px;white-space:nowrap}
.install .x{flex:none;border:0;background:none;color:var(--muted);font-size:16px;padding:8px 4px}
.steps{margin:0;padding-left:1.5em;display:flex;flex-direction:column;gap:12px;font-size:19px;line-height:1.5}
.steps li::marker{color:var(--accent);font-weight:700}
.ico{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;margin:0 .15em;color:var(--accent)}
.url-box{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--sunk);border-radius:12px;padding:10px 12px}
.url-box span{flex:1 1 220px;min-width:0;overflow-wrap:anywhere;font-size:15px;-webkit-user-select:all;user-select:all}
/* ---------- People ---------- */
.who-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--sunk);padding:5px;border-radius:99px}
.who-tabs button{border:0;background:none;border-radius:99px;padding:10px 4px;font-family:var(--display);font-size:22px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.who-tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 2px 8px rgba(200,71,95,.25)}
.who-name{margin:18px 0 0;font-family:var(--display);font-size:52px;line-height:1.1;font-weight:700;color:var(--accent);letter-spacing:.08em;text-wrap:balance}
.plan-name{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.plan-name span{font-size:32px;color:var(--accent);letter-spacing:.06em}
.plan-name small{font-family:var(--font);font-size:14px;color:var(--muted);font-weight:500;letter-spacing:.2em}
.plan-tabs{margin-top:14px}
/* ---------- Sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:600px){.sheet-wrap{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0;font-size:24px}
.sheet .sub{margin:-12px 0 0;color:var(--muted);font-size:17px}
.field{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.inp{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:20px}
.inp:focus{border-color:var(--accent);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:17px}
.chip .cap{width:10px;height:13px;margin:0}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--cap);position:relative}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--surface) inset}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--sunk);border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;padding:10px 4px;font-weight:700;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.seg button small{font-family:var(--num);font-weight:500;font-size:14px;color:var(--muted)}
.chips.meds .chip{font-size:19px;padding:10px 16px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg button[data-eye="L"][aria-pressed="true"]{color:var(--eyeL)}
.seg button[data-eye="R"][aria-pressed="true"]{color:var(--eyeR)}
.seg button[data-eye="B"][aria-pressed="true"]{color:var(--accent)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:28px;line-height:1}
.stepper output{font-family:var(--num);font-size:35px;font-weight:600;min-width:2ch;text-align:center}
.time-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.time-row .inp{width:auto;flex:0 0 140px}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.daypick button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;font-weight:700;line-height:1.2}
.daypick button small{font-family:var(--num);font-weight:500;font-size:13px;color:var(--muted)}
.daypick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.daypick button[aria-pressed="true"] small{color:var(--on-accent)}
.err{color:var(--warn);font-size:17px;font-weight:500;margin:-6px 0 0}
.actions{display:flex;gap:10px;align-items:center}
.actions .grow{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 18px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--warn)}
.btn.danger-fill{background:var(--warn);border-color:var(--warn);color:var(--surface)}
textarea.inp{min-height:110px;font-family:var(--num);font-size:16px;resize:vertical}
.help{font-size:17px;color:var(--muted);margin:0}

@media (max-width:359px){.eyes{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<main id="home" class="wrap" aria-labelledby="today-h"></main>
<main id="plan" hidden></main>
<div class="dock" id="dock"><div class="wrap"><button class="btn-plan" data-act="go-plan">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>規劃</button></div></div>
<div class="sheet-wrap" id="sheet" hidden><div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet-body"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
const KEY='eyedrop-planner-v1';
const WD=['日','一','二','三','四','五','六'];
const CAPS=[['#D23B3B','紅'],['#F2C230','黃'],['#2E9A4E','綠'],['#2F6FD6','藍'],['#7B4FC4','紫']];
const CAP_MAP={'#F4F4EE':'#2F6FD6','#EE7A1C':'#F2C230','#14A3A3':'#2E9A4E','#E58FB5':'#D23B3B','#B48A5A':'#F2C230','#8A9196':'#2F6FD6'};
const EYE={L:{t:'左眼',c:'OS'},R:{t:'右眼',c:'OD'},B:{t:'雙眼',c:'OU'}};
const SLOTS=[['am','早上'],['pm','晚上'],['bed','睡前']];
const SLOT_ORDER={am:0,pm:1,bed:2};
const slotName=t=>({am:'早上',pm:'晚上',bed:'睡前'}[t]||'');
const FIXED=[['紅色藥水','#D23B3B'],['黃色藥水','#F2C230'],['青眼露','#2E9A4E'],['安妥','#2F6FD6'],['康麗庚','#7B4FC4']];
const PEOPLE=[['p1','石聿庭'],['p2','石又愷']];
const RENAME={'紅色':'紅色藥水','黃色':'黃色藥水'};
const fixedIdx=n=>{const i=FIXED.findIndex(f=>f[0]===n);return i<0?99:i};

const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const monday=d=>addDays(d,-((d.getDay()+6)%7));
const md=d=>(d.getMonth()+1)+'/'+d.getDate();
const wkLabel=ws=>'週（'+md(ws)+'～'+md(addDays(ws,6))+'）';
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eyesOf=e=>e.eye==='B'?['L','R']:[e.eye];
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const sig=e=>[e.medId,e.eye,e.drops,e.time].join('|');

function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.meds)&&(o.plans||o.weeks||o.people))return o}}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function migrate(o){
  if(!o.v||o.v<2){Object.values(o.plans||{}).forEach(a=>a.forEach(e=>{const t=e.time||'';
    e.time=SLOT_ORDER[t]!=null?t:(!t||t<'12:00')?'am':t<'21:30'?'pm':'bed';e.drops=e.drops>=2?2:1}));o.v=2}
  if(o.v<3){
    const weeks={},map={};
    Object.keys(o.plans||{}).sort().forEach(k=>{const w=key(monday(parse(k))),arr=weeks[w]=weeks[w]||[];
      (o.plans[k]||[]).forEach(e=>{let t=arr.find(x=>sig(x)===sig(e));if(!t){t={id:uid(),medId:e.medId,eye:e.eye,drops:e.drops,time:e.time};arr.push(t)}map[e.id]=t.id})});
    const log={};Object.keys(o.log||{}).forEach(k=>{const l={};Object.keys(o.log[k]).forEach(dk=>{const p=dk.split(':');if(map[p[0]])l[map[p[0]]+':'+p[1]]=o.log[k][dk]});log[k]=l});
    o.weeks=weeks;o.log=log;delete o.plans;o.v=3;
  }
  if(o.v<4){o.people={p1:{weeks:o.weeks||{},log:o.log||{}},p2:{weeks:{},log:{}}};delete o.weeks;delete o.log;o.cur='p1';o.v=4}
  o.people=o.people||{};PEOPLE.forEach(p=>{const x=o.people[p[0]]=o.people[p[0]]||{};x.name=p[1];x.weeks=x.weeks||{};x.log=x.log||{}});
  if(!o.people[o.cur])o.cur='p1';
  o.meds.forEach(m=>{if(CAP_MAP[m.cap])m.cap=CAP_MAP[m.cap];if(!CAPS.some(c=>c[0]===m.cap))m.cap=CAPS[3][0]});
  o.meds.forEach(m=>{if(RENAME[m.name]&&!o.meds.find(x=>x.name===RENAME[m.name]))m.name=RENAME[m.name]});
  FIXED.forEach(f=>{const m=o.meds.find(x=>x.name===f[0]);if(m)m.cap=f[1];else o.meds.push({id:uid(),name:f[0],cap:f[1]})});
  {const used=new Set();PEOPLE.forEach(p=>Object.values(o.people[p[0]].weeks).forEach(a=>a.forEach(e=>used.add(e.medId))));o.meds=o.meds.filter(m=>used.has(m.id)||fixedIdx(m.name)<99)}
  return o;
}
function seed(){
  const s={v:4,meds:FIXED.map(f=>({id:uid(),name:f[0],cap:f[1]})),people:{},cur:'p1',sample:true,sampleVer:SAMPLE_VER};
  const [mRed,mYel,mGrn,mBlu,mPur]=s.meds;
  const E=(m,eye,drops,time)=>({id:uid(),medId:m.id,eye,drops,time});
  const ws=monday(new Date()),today=key(new Date());
  const plans={p1:[E(mBlu,'B',1,'am'),E(mYel,'L',2,'pm'),E(mRed,'R',1,'bed')],p2:[E(mGrn,'B',1,'am'),E(mPur,'L',1,'bed')]};
  PEOPLE.forEach(([pid,name])=>{const a=plans[pid],log={};
    for(let i=0;i<7;i++){const k=key(addDays(ws,i));if(k>today)break;const lg={};
      a.forEach(e=>eyesOf(e).forEach(y=>{if(k<today){if(!(pid==='p1'&&i===1&&e.time==='bed'))lg[e.id+':'+y]='已點'}else if(e.time==='am')lg[e.id+':'+y]='08:00'}));log[k]=lg}
    s.people[pid]={name,weeks:{[key(ws)]:a},log}});
  return s;
}

const SAMPLE_VER=4;
let S=migrate(load()||seed());
(function prune(){const cut=key(addDays(new Date(),-400));Object.values(S.people).forEach(p=>{Object.keys(p.log).forEach(k=>{if(k<cut)delete p.log[k]});Object.keys(p.weeks).forEach(k=>{if(k<cut)delete p.weeks[k]})})})();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
if(S.sample&&S.sampleVer!==SAMPLE_VER)S=seed();
save();
let wk=monday(new Date());
let ed=null,pendingConfirm=null;

const $=id=>document.getElementById(id);
const P=()=>S.people[S.cur];
const med=id=>S.meds.find(m=>m.id===id)||{name:'(未命名)',cap:'#2F6FD6'};
const byTime=(a,b)=>((SLOT_ORDER[a.time]??9)-(SLOT_ORDER[b.time]??9))||(fixedIdx(med(a.medId).name)-fixedIdx(med(b.medId).name));
const weekList=w=>(P().weeks[w]||[]).slice().sort(byTime);
const dayList=k=>weekList(key(monday(parse(k))));
function stats(k){let t=0,d=0;const lg=P().log[k]||{};dayList(k).forEach(e=>eyesOf(e).forEach(y=>{t++;if(lg[e.id+':'+y])d++}));return{t,d}}
function commit(){save();render()}
function pruneMeds(){const used=new Set();Object.values(S.people).forEach(p=>Object.values(p.weeks).forEach(a=>a.forEach(e=>used.add(e.medId))));S.meds=S.meds.filter(m=>used.has(m.id)||fixedIdx(m.name)<99)}
const clone=a=>a.map(e=>Object.assign({},e,{id:uid()}));

const ICON_DROP='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5c-.4 0-.7.2-.9.5C9.4 5.6 5.5 10.9 5.5 14.6a6.5 6.5 0 0 0 13 0c0-3.7-3.9-9-5.6-11.6-.2-.3-.5-.5-.9-.5z"/></svg>';
const ICON_TICK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CHEV=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d?'M9 5l7 7-7 7':'M15 5l-7 7 7 7'}"/></svg>`;
const capEl=c=>`<span class="cap" style="--cap:${esc(c)}"></span>`;


/* ---------- Install to home screen ---------- */
const ICON_PHONE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M12 7v7M9 11l3 3 3-3M10.5 18.5h3"/></svg>';
const ICON_SHARE='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="分享圖示"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5v9h14v-9h-1"/></svg>';
const ICON_DOTS='<svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-label="選單圖示"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
const APP_URL='https://shiller0225.github.io/eyedrop-planner/';
const UA=navigator.userAgent||'';
const isIOS=/iPhone|iPad|iPod/.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isAndroid=/Android/.test(UA);
const inApp=/Line\/|FBAN|FBAV|FB_IAB|Instagram|MicroMessenger|GSA\/|KAKAOTALK|Twitter|; wv\)/i.test(UA);
const inFrame=(()=>{try{return window.top!==window.self}catch(e){return true}})();
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
let deferredPrompt=null,installHidden=false;
try{installHidden=localStorage.getItem('eyedrop-install-hide')==='1'}catch(e){}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(location.hash!=='#plan')renderHome()});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;installHidden=true;render();toast('已安裝到主畫面')});
const canOfferInstall=()=>!isStandalone()&&!inFrame;
function installBar(){
  if(!canOfferInstall()||installHidden)return'';
  const sub=inApp?`目前在 App 內建瀏覽器，請改用 ${isIOS?'Safari':'Chrome'} 開啟後安裝`:'像一般 App 一樣，從主畫面一點就開';
  return `<div class="install"><span class="install-ico">${ICON_PHONE}</span><div class="txt"><b>安裝到手機主畫面</b><span>${sub}</span></div>
    <button class="go" data-act="install">${deferredPrompt?'安裝':'怎麼裝'}</button><button class="x" data-act="install-hide" aria-label="先不要">✕</button></div>`;
}
function installSheet(){
  ed=null;let title='安裝到手機主畫面',intro='',steps=[],extra='';
  const urlBox=`<div class="url-box"><span class="num">${APP_URL}</span><button type="button" class="btn" data-act="copy-url">複製網址</button></div>`;
  if(inApp){
    intro='你現在是在 LINE、Google 或其他 App 內建的瀏覽器裡，這裡沒有安裝功能。';
    steps=isIOS?['點畫面右上角或右下角的「⋯」或'+ICON_SHARE+'分享',`選「以 Safari 開啟」或「用瀏覽器開啟」`,'在 Safari 打開後，再按一次 App 裡的「安裝到手機」']
               :['點畫面右上角的'+ICON_DOTS,'選「用 Chrome 開啟」或「以瀏覽器開啟」','在 Chrome 打開後，再按一次 App 裡的「安裝到手機」'];
    extra='<p class="help">也可以複製下面的網址，貼到 '+(isIOS?'Safari':'Chrome')+' 開啟：</p>'+urlBox;
  }else if(isIOS){
    const chrome=/CriOS/.test(UA),other=/FxiOS|EdgiOS|OPiOS/.test(UA);
    if(other){intro='這個瀏覽器不一定能加入主畫面，建議改用 Safari 開啟。';steps=['複製下面的網址','打開 Safari，貼上網址開啟','點'+ICON_SHARE+'分享 →「加入主畫面」'];extra=urlBox}
    else steps=chrome?['點網址列右邊的'+ICON_SHARE+'分享','往下找到「加入主畫面」','右上角按「新增」']
                     :['點 Safari 下方（或網址列旁）的'+ICON_SHARE+'分享','往下滑，點「加入主畫面」','右上角按「新增」'];
    if(!other)extra='<p class="help">完成後，主畫面會出現眼睛圖示的「眼藥水」。之後請從那個圖示開啟。</p>';
  }else if(isAndroid){
    steps=['點 Chrome 右上角的'+ICON_DOTS,'選「安裝應用程式」或「加到主畫面」','按「安裝」'];
    extra='<p class="help">用三星瀏覽器的話：點下方「≡」→「新增頁面至」→「主畫面」。</p>';
  }else{
    steps=['在電腦版 Chrome，點網址列右側的安裝圖示','按「安裝」'];
    extra='<p class="help">要裝在手機上，請用手機掃描 QR code 開啟這個網址。</p>'+urlBox;
  }
  $('sheet-body').innerHTML=`<h2 id="sheet-title">${title}</h2>${intro?`<p class="help">${intro}</p>`:''}
    <ol class="steps">${steps.map(t=>`<li>${t}</li>`).join('')}</ol>${extra}
    <div class="actions"><span class="grow"></span><button type="button" class="btn primary" data-act="close">知道了</button></div>`;
  showSheet();
}

function tabs(){return `<div class="who-tabs" role="tablist" aria-label="切換對象">${PEOPLE.map(([id,n])=>`<button role="tab" data-act="person" data-p="${id}" aria-selected="${S.cur===id}">${esc(n)}</button>`).join('')}</div>`}
function banner(){return S.sample?`<div class="banner"><span>目前是<b>範例資料</b>，方便你先看看畫面。</span><button data-act="clear-sample">清除範例，開始規劃</button><button data-act="keep-sample">保留</button></div>`:''}

function renderHome(){
  const t=new Date(),k=key(t),list=dayList(k),lg=P().log[k]||{},st=stats(k),ws=monday(t);
  const col=y=>{
    const items=list.filter(e=>eyesOf(e).includes(y));
    const done=items.filter(e=>lg[e.id+':'+y]).length;
    const cards=items.map(e=>{const m=med(e.medId),dk=e.id+':'+y,dn=lg[dk];
      return `<button class="dose" data-act="toggle" data-k="${dk}" aria-pressed="${!!dn}" aria-label="${EYE[y].t} ${esc(m.name)} ${e.drops} 滴 ${slotName(e.time)}，${dn?'已點':'尚未點'}">
        <span class="dose-name">${capEl(m.cap)}<span>${esc(m.name)}</span></span>
        <span class="dose-row"><span class="drops"><b>${e.drops}</b>滴</span><span class="dose-time">${slotName(e.time)}</span></span>
        <span class="dose-state">${dn?ICON_TICK+'<span class="num">'+esc(dn)+'</span> 已點':'<span class="ring"></span>點完按這裡'}</span>
      </button>`}).join('');
    return `<div class="eye-col ${y}"><div class="eye-h"><span class="eye-code">${EYE[y].c}</span><b>${EYE[y].t}</b><span class="cnt num">${done}/${items.length}</span></div>${cards||'<div class="eye-empty">今天不用點</div>'}</div>`;
  };
  $('home').innerHTML=`
    ${tabs()}
    <h1 class="who-name" id="today-h">${esc(P().name)}</h1>
    <h2 class="today-h">${t.getMonth()+1}月${t.getDate()}日<span class="wd">星期${WD[t.getDay()]}</span></h2>
    <div class="today-sub num">${wkLabel(ws)}</div>
    ${st.t?`<div class="progress"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${st.t}" aria-valuenow="${st.d}" aria-label="今日完成"><i style="width:${st.d/st.t*100}%"></i></div><span class="num">已點 ${st.d} / ${st.t}</span></div>`:''}
    ${installBar()}
    ${banner()}
    ${list.length?`<section class="eyes" aria-label="今日點藥">${col('L')}${col('R')}</section>
      <p class="note">同一眼點兩種以上藥水時，中間建議間隔約 5 分鐘。藥名、滴數與次數請依醫師或藥師指示。</p>`
    :`<div class="empty-day"><h2>這週還沒有規劃</h2><p>按下方「規劃」，排好這週每天要點的藥水。</p></div>`}`;
}

function renderPlan(){
  const ws=wk,w=key(ws),today=key(new Date()),thisMon=monday(new Date());
  const rel=Math.round((ws-thisMon)/6048e5);
  const tag=rel===0?'本週':rel===1?'下週':rel===-1?'上週':(rel>0?rel+' 週後':(-rel)+' 週前');
  const list=weekList(w),prevW=key(addDays(ws,-7)),hasPrev=(P().weeks[prevW]||[]).length>0;
  const rows=list.map(e=>{const m=med(e.medId);
    return `<li><button class="entry" data-act="edit" data-id="${e.id}" aria-label="編輯 ${slotName(e.time)} ${esc(m.name)}"><span class="t">${slotName(e.time)}</span>${capEl(m.cap)}<span class="n">${esc(m.name)}</span><span class="eye-chip ${e.eye}">${EYE[e.eye].t}</span><span class="dr">${e.drops} 滴</span></button></li>`}).join('');
  let cells='';
  for(let i=0;i<7;i++){const d=addDays(ws,i),k=key(d),st=stats(k);let cls='',txt='—';
    if(st.t&&k<=today){if(st.d===st.t){cls='ok';txt='✓'}else if(k<today){cls='miss';txt='漏 '+(st.t-st.d)}else{txt=st.d+'/'+st.t}}
    cells+=`<div class="cell ${cls}${k===today?' today':''}"><span>${WD[d.getDay()]}</span><b class="num">${md(d)}</b><span class="st num">${txt}</span></div>`}
  $('plan').innerHTML=`
    <div class="plan-top"><div class="wrap">
      <div class="bar-row"><button class="link-btn" data-act="go-home">‹ 今日</button><h1 class="plan-name"><span>${esc(P().name)}</span><small>規劃</small></h1><button class="link-btn r" data-act="this-week" ${rel===0?'style="visibility:hidden"':''}>回本週</button></div>
      <div class="weeknav"><button class="wk-arrow" data-act="wk-prev" aria-label="上一週">${CHEV(0)}</button>
        <div class="wk"><div class="wk-label num">${wkLabel(ws)}</div><div class="wk-tag">${tag}</div></div>
        <button class="wk-arrow" data-act="wk-next" aria-label="下一週">${CHEV(1)}</button></div>
    </div></div>
    <div class="wrap">
      <div class="plan-tabs">${tabs()}</div>
      ${banner()}
      <section class="card">
        <div class="card-h"><h2 class="wk-range num">${md(ws)}～${md(addDays(ws,6))}</h2><span>這週每天相同</span></div>
        ${list.length?`<ul class="entries">${rows}</ul>`:`<p class="help card-empty">這週還沒有規劃。</p>${hasPrev?'<button class="chip-btn" data-act="use-prev">沿用上週的規劃</button>':''}`}
        <button class="add" data-act="add">＋ 新增點藥</button>
      </section>
      <div class="week-actions">${list.length?'<button class="chip-btn" data-act="copy-next">複製到下週</button><button class="chip-btn danger" data-act="clear-week">清空這週</button>':''}</div>
      <section class="card">
        <div class="card-h"><h2>這週點藥記錄</h2><span>依首頁打勾統計</span></div>
        <div class="strip">${cells}</div>
      </section>
      <div class="plan-foot"><button class="chip-btn" data-act="backup">備份與還原</button>${canOfferInstall()?'<button class="chip-btn" data-act="install-help">安裝到手機</button>':''}</div>
    </div>`;
}

function render(){
  const plan=location.hash==='#plan';
  $('home').hidden=plan;$('plan').hidden=!plan;$('dock').hidden=plan;
  plan?renderPlan():renderHome();
}

/* ---------- Editor ---------- */
function openEditor(id){
  const w=key(wk),e=id?(P().weeks[w]||[]).find(x=>x.id===id):null,m=e?med(e.medId):null;
  ed={w,id:e?e.id:null,name:m?m.name:'',cap:m?m.cap:CAPS[0][0],eye:e?e.eye:'B',drops:e?e.drops:1,time:e?e.time:'am',err:''};
  drawEditor();showSheet();
}
function drawEditor(){
  const medChips=S.meds.slice().sort((a,b)=>fixedIdx(a.name)-fixedIdx(b.name)).map(m=>`<button type="button" class="chip" data-act="pick-med" data-id="${m.id}" aria-pressed="${m.name===ed.name}">${capEl(m.cap)}${esc(m.name)}</button>`).join('');
  $('sheet-body').innerHTML=`
    <h2 id="sheet-title">${ed.id?'編輯點藥':'新增點藥'}</h2>
    <p class="sub num">${esc(P().name)}・${wkLabel(parse(ed.w))}　每天</p>
    <div class="field"><span class="lbl">藥水品名</span><div class="chips meds">${medChips}</div></div>
    <div class="field"><span class="lbl">眼別</span><div class="seg">
      ${['L','R','B'].map(y=>`<button type="button" data-act="pick-eye" data-eye="${y}" aria-pressed="${ed.eye===y}">${EYE[y].t}<small>${EYE[y].c}</small></button>`).join('')}</div></div>
    <div class="field"><span class="lbl">時間</span><div class="seg">
      ${SLOTS.map(t=>`<button type="button" data-act="pick-slot" data-t="${t[0]}" aria-pressed="${ed.time===t[0]}">${t[1]}</button>`).join('')}</div></div>
    <div class="field"><span class="lbl">滴數</span><div class="seg two">
      ${[1,2].map(n=>`<button type="button" data-act="pick-drops" data-n="${n}" aria-pressed="${ed.drops===n}">${n} 滴</button>`).join('')}</div></div>
    ${ed.err?`<p class="err" role="alert">${esc(ed.err)}</p>`:''}
    <div class="actions">${ed.id?'<button type="button" class="btn danger" data-act="del">刪除</button>':''}<span class="grow"></span>
      <button type="button" class="btn" data-act="close">取消</button><button type="button" class="btn primary" data-act="save">儲存</button></div>`;
}
function saveEditor(){
  const m=S.meds.find(x=>x.name===ed.name);
  if(!m){ed.err='請選擇藥水品名。';drawEditor();return}
  const arr=P().weeks[ed.w]=P().weeks[ed.w]||[];
  if(ed.id)Object.assign(arr.find(x=>x.id===ed.id),{medId:m.id,eye:ed.eye,drops:ed.drops,time:ed.time});
  else arr.push({id:uid(),medId:m.id,eye:ed.eye,drops:ed.drops,time:ed.time});
  const wasEdit=!!ed.id;pruneMeds();hideSheet();commit();toast(wasEdit?'已更新':'已加入這週');
}

/* ---------- Sheets / toast ---------- */
let lastFocus=null;
function showSheet(){lastFocus=document.activeElement;$('sheet').hidden=false}
function hideSheet(){$('sheet').hidden=true;pendingConfirm=null;if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
function confirmSheet(title,msg,ok,fn){
  ed=null;pendingConfirm=fn;
  $('sheet-body').innerHTML=`<h2 id="sheet-title">${esc(title)}</h2><p class="help">${esc(msg)}</p>
    <div class="actions"><span class="grow"></span><button type="button" class="btn" data-act="close">取消</button><button type="button" class="btn danger-fill" data-act="confirm-ok">${esc(ok)}</button></div>`;
  showSheet();
}
function backupSheet(){
  ed=null;
  $('sheet-body').innerHTML=`<h2 id="sheet-title">備份與還原</h2>
    <p class="help">資料只存在這支手機的這個 App 裡。換手機或清除瀏覽器資料前，先複製備份碼，貼到記事本保存。</p>
    <div class="field"><label class="lbl" for="f-export">備份碼</label><textarea class="inp" id="f-export" readonly>${esc(JSON.stringify(S))}</textarea>
      <div><button type="button" class="btn primary" data-act="copy-export">複製備份碼</button></div></div>
    <div class="field"><label class="lbl" for="f-import">還原：貼上備份碼</label><textarea class="inp" id="f-import" placeholder="把先前複製的備份碼貼在這裡"></textarea>
      <p class="err" id="imp-err" role="alert" hidden></p>
      <div><button type="button" class="btn danger" data-act="do-import">用這份備份取代目前資料</button></div></div>
    <div class="actions"><span class="grow"></span><button type="button" class="btn" data-act="close">完成</button></div>`;
  showSheet();
}
let tt;function toast(s){const t=$('toast');t.textContent=s;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2000)}

/* ---------- Events ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  switch(a){
    case 'go-plan':wk=monday(new Date());location.hash='plan';break;
    case 'go-home':location.hash='';break;
    case 'wk-prev':wk=addDays(wk,-7);renderPlan();break;
    case 'wk-next':wk=addDays(wk,7);renderPlan();break;
    case 'this-week':wk=monday(new Date());renderPlan();break;
    case 'toggle':{const k=key(new Date()),lg=P().log[k]=P().log[k]||{},dk=b.dataset.k;
      if(lg[dk])delete lg[dk];else lg[dk]=nowHM();commit();
      const nb=document.querySelector(`[data-k="${dk}"]`);if(nb)nb.focus();break}
    case 'add':openEditor(null);break;
    case 'edit':openEditor(b.dataset.id);break;
    case 'close':hideSheet();break;
    case 'pick-med':{const m=S.meds.find(x=>x.id===b.dataset.id);ed.name=m.name;ed.cap=m.cap}ed.err='';drawEditor();break;
    case 'pick-eye':ed.eye=b.dataset.eye;drawEditor();break;
    case 'pick-slot':ed.time=b.dataset.t;drawEditor();break;
    case 'pick-drops':ed.drops=Number(b.dataset.n);drawEditor();break;
    case 'save':saveEditor();break;
    case 'del':{const w=ed.w,id=ed.id;P().weeks[w]=(P().weeks[w]||[]).filter(x=>x.id!==id);pruneMeds();hideSheet();commit();toast('已刪除');break}
    case 'confirm-ok':{const fn=pendingConfirm;hideSheet();if(fn)fn();break}
    case 'use-prev':P().weeks[key(wk)]=clone(P().weeks[key(addDays(wk,-7))]||[]);commit();toast('已沿用上週的規劃');break;
    case 'copy-next':{const nx=addDays(wk,7),n=(P().weeks[key(nx)]||[]).length;
      const run=()=>{P().weeks[key(nx)]=clone(P().weeks[key(wk)]||[]);wk=nx;commit();toast('已複製到下週')};
      if(n)confirmSheet('複製到下週',`${P().name}下${wkLabel(nx)}已有 ${n} 項規劃，複製後會被取代。`,'取代',run);else run();break}
    case 'clear-week':confirmSheet('清空這週',`刪除${P().name}${wkLabel(wk)}的規劃。`,'清空',()=>{delete P().weeks[key(wk)];pruneMeds();commit();toast('已清空')});break;
    case 'clear-sample':S=migrate({v:4,meds:[],people:{},cur:S.cur,sample:false});commit();toast('已清除範例');break;
    case 'person':if(S.cur!==b.dataset.p){S.cur=b.dataset.p;commit();window.scrollTo(0,0)}break;
    case 'keep-sample':S.sample=false;commit();break;
    case 'backup':backupSheet();break;
    case 'install':if(deferredPrompt){const dp=deferredPrompt;deferredPrompt=null;dp.prompt();(dp.userChoice||Promise.resolve()).then(()=>render(),()=>render())}else installSheet();break;
    case 'install-help':installSheet();break;
    case 'install-hide':installHidden=true;try{localStorage.setItem('eyedrop-install-hide','1')}catch(e){}renderHome();toast('之後可在「規劃」頁最下方找到「安裝到手機」');break;
    case 'copy-url':{const fb=()=>toast('請長按網址複製');try{navigator.clipboard.writeText(APP_URL).then(()=>toast('已複製網址'),fb)}catch(e){fb()}break}
    case 'copy-export':{const ta=$('f-export');const fb=()=>{ta.focus();ta.select();toast('已選取，請按「拷貝」')};
      try{navigator.clipboard.writeText(ta.value).then(()=>toast('已複製'),fb)}catch(e){fb()}break}
    case 'do-import':{const er=$('imp-err');try{const o=JSON.parse($('f-import').value.trim());
      if(!o||!Array.isArray(o.meds)||!(o.plans||o.weeks||o.people))throw 0;
      o.sample=false;S=migrate(o);hideSheet();commit();toast('已還原備份')}
      catch(e){er.textContent='這段文字不是有效的備份碼，請確認是完整複製的內容。';er.hidden=false}break}
  }
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('sheet').hidden)hideSheet()});
window.addEventListener('hashchange',()=>{hideSheet();render();window.scrollTo(0,0)});
let sx=null,sy=0;
document.addEventListener('touchstart',e=>{if(!$('sheet').hidden||e.touches.length>1){sx=null;return}sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)>80&&Math.abs(dy)<50){const i=PEOPLE.findIndex(p=>p[0]===S.cur),j=i+(dx<0?1:-1);if(PEOPLE[j]){S.cur=PEOPLE[j][0];commit()}}},{passive:true});
let shownDay=key(new Date());
document.addEventListener('visibilitychange',()=>{if(!document.hidden){shownDay=key(new Date());render()}});
setInterval(()=>{const k=key(new Date());if(k!==shownDay&&!document.hidden&&$('sheet').hidden){shownDay=k;render()}},60000);
render();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
</html>
